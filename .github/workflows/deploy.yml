name: Deploy Custom Node

on:
  push:
    branches: [ development ]

jobs:
  deploy:
    environment: development
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add Known Hosts
      run: ssh-keyscan -H ${{ secrets.IP }} >> ~/.ssh/known_hosts

    - name: Deploy and Run
      env:
        DEPLOY_IP: ${{ secrets.IP }}
        DEPLOY_USER: ${{ secrets.SERVER_USER }}
      run: |
        # Make the script executable locally so permission syncs over
        chmod +x deploy.sh

        # Strip secrets
        CLEAN_IP=$(echo "$DEPLOY_IP" | xargs)
        CLEAN_USER=$(echo "$DEPLOY_USER" | xargs)

        # Sync files (including the new deploy.sh)
        rsync -avz --exclude '.git' -e "ssh -o StrictHostKeyChecking=no" ./ "${CLEAN_USER}@${CLEAN_IP}:/opt/n8n-docker-caddy/n8n-nodes-sumsub"

        # Execute the script on the server
        ssh -o StrictHostKeyChecking=no "${CLEAN_USER}@${CLEAN_IP}" "/opt/n8n-docker-caddy/n8n-nodes-sumsub/deploy.sh"
