name: Deploy Custom Node

on:
  push:
    branches: [ development ]

jobs:
  deploy:
    environment: development
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add Known Hosts
      run: ssh-keyscan -H ${{ secrets.IP }} >> ~/.ssh/known_hosts

    - name: Deploy Files
      run: |
        # Recursively copy current directory to server
        # Using -r for recursive, -o StrictHostKeyChecking=no to avoid prompt issues (redundant with known_hosts but safe)
        scp -r -o StrictHostKeyChecking=no . ${{ secrets.SERVER_USER }}@${{ secrets.IP }}:/opt/n8n-docker-caddy/n8n-nodes-sumsub

    - name: Build and Restart
      run: |
        ssh ${{ secrets.SERVER_USER }}@${{ secrets.IP }} << 'EOF'
          cd /opt/n8n-docker-caddy/
          docker compose exec -u node n8n sh -c "cd /home/node/.n8n/custom/n8n-nodes-sumsub && npm install --include=dev && npm run build"
          docker compose restart n8n
        EOF
