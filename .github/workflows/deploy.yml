name: Deploy Custom Node

on:
  push:
    branches: [ development ]

jobs:
  deploy:
    environment: development
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add Known Hosts
      run: ssh-keyscan -H ${{ secrets.IP }} >> ~/.ssh/known_hosts

    - name: Deploy Files
      env:
        DEPLOY_IP: ${{ secrets.IP }}
        DEPLOY_USER: ${{ secrets.SERVER_USER }}
      run: |
        # Strip any potential whitespace/newlines from secrets
        CLEAN_IP=$(echo "$DEPLOY_IP" | xargs)
        CLEAN_USER=$(echo "$DEPLOY_USER" | xargs)

        rsync -avz --exclude '.git' -e "ssh -o StrictHostKeyChecking=no" ./ "${CLEAN_USER}@${CLEAN_IP}:/opt/n8n-docker-caddy/n8n-nodes-sumsub"

    - name: Build and Restart
      env:
        DEPLOY_IP: ${{ secrets.IP }}
        DEPLOY_USER: ${{ secrets.SERVER_USER }}
      run: |
        CLEAN_IP=$(echo "$DEPLOY_IP" | xargs)
        CLEAN_USER=$(echo "$DEPLOY_USER" | xargs)

        ssh -o StrictHostKeyChecking=no "${CLEAN_USER}@${CLEAN_IP}" << 'EOF'
          set -e # Fail immediately if error
          set -x # Print commands as they run

          cd /opt/n8n-docker-caddy/

          echo "🔍 Checking container status..."
          docker compose ps

          echo "🔍 Verifying directory inside container..."
          docker compose exec -T -u root n8n ls -ld /home/node/.n8n/custom/n8n-nodes-sumsub

          echo "🔧 Fixing permissions..."
          docker compose exec -T -u root n8n chown -R node:node /home/node/.n8n/custom/n8n-nodes-sumsub

          echo "📦 Installing dependencies and Building..."
          docker compose exec -T -u node n8n sh -c "cd /home/node/.n8n/custom/n8n-nodes-sumsub && npm install --include=dev && npm run build"

          echo "🔄 Restarting n8n..."
          docker compose restart n8n

          echo "✅ Deployment Successfully Completed!"
        EOF
